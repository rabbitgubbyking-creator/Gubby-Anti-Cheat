name: Service tests

on:
  push:
    paths:
      - "service/**"
      - ".github/workflows/service-tests.yml"
  pull_request:
    paths:
      - "service/**"
      - ".github/workflows/service-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        working-directory: service
        run: python -m unittest discover -s tests -v
